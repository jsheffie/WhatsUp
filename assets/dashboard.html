<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhatsUp</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1b1f24;
      --header: #24292f;
      --line: #3a414b;
      --text: #e8eaed;
      --muted: #9aa3ad;
      --link: #7eb0ff;
      --link-hover: #b7d0ff;
      --up: #3dd68c;
      --down: #f07178;
      --gray: #2a3038;
      --black: #101114;
      --gray-all-up: #1d4a33;
      --black-all-up: #143524;
      --chip: #15181d;
      --focus: #ffd166;
      --remote: #d2a8ff;
      --remote-line: #6e40c9;
      --stop: #d6363f;
      --stop-hover: #ee4c55;
      --start: #1a7f46;
      --start-hover: #23a35b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, Cantarell, "Noto Sans", sans-serif;
    }

    header {
      background: var(--header);
      border-bottom: 1px solid var(--line);
      padding: 22px 28px 0;
    }

    .title-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 650;
      letter-spacing: -0.03em;
    }

    .summary {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 10px;
    }

    label.toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    button.quit, button.text-button {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
    }

    button.quit:hover, button.text-button:hover { border-color: var(--muted); }

    nav.tabs {
      display: flex;
      gap: 22px;
      margin-top: 18px;
    }

    nav.tabs button {
      background: none;
      border: 0;
      border-bottom: 2px solid transparent;
      color: var(--link);
      font: inherit;
      padding: 8px 0 10px;
      cursor: pointer;
    }

    nav.tabs button[aria-selected="true"] {
      border-bottom-color: var(--link);
      font-weight: 600;
    }

    nav.tabs .divider {
      align-self: center;
      width: 1px;
      height: 16px;
      background: var(--line);
    }

    .panel h2 {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 22px 0 8px;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: 0.01em;
    }

    .panel.first h2 { margin-top: 0; }
    .panel h2.hidden { display: none; }

    .tag {
      padding: 1px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font: 500 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .tag.remote {
      border-color: var(--remote-line);
      color: var(--remote);
    }

    .note {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    main { padding: 22px 28px 40px; }

    .banner {
      display: none;
      margin-bottom: 14px;
      padding: 10px 12px;
      border: 1px solid var(--down);
      border-radius: 8px;
      color: #ffd5d8;
    }

    .banner.show { display: block; }
    .banner.dismissable { cursor: pointer; }

    /* A table wider than the screen scrolls inside this box, not the page. */
    .table-scroll { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border: 1px solid #000;
    }

    th {
      text-align: left;
      font-weight: 650;
      padding: 12px 14px;
      background: #2c323a;
      border-bottom: 1px solid var(--line);
    }

    td {
      padding: 11px 14px;
      vertical-align: middle;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    tr.gray td { background: var(--gray); }
    tr.black td { background: var(--black); }
    tr.gray.all-up td { background: var(--gray-all-up); }
    tr.black.all-up td { background: var(--black-all-up); }
    tr.hidden { display: none; }

    /* The herdr workspace after a stack name: "jds/h1-herberth". */
    .herdr {
      color: var(--muted);
      white-space: nowrap;
    }
    .herdr .label {
      display: inline-block;
      max-width: 22ch;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: bottom;
    }

    .service {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
    }

    .service.up { cursor: pointer; color: var(--link); }
    .service.up:hover .name { color: var(--link-hover); text-decoration: underline; }
    .service:disabled { cursor: default; color: var(--muted); }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--down);
      box-shadow: 0 0 0 3px rgba(240, 113, 120, 0.12);
    }

    .service.up .dot {
      background: var(--up);
      box-shadow: 0 0 0 3px rgba(61, 214, 140, 0.14);
    }

    .service.offline .dot {
      background: var(--muted);
      box-shadow: 0 0 0 3px rgba(154, 163, 173, 0.12);
    }

    .copy { display: flex; flex-direction: column; min-width: 0; }
    .name { font-weight: 550; }
    .port {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }

    /* The actions column hugs its buttons; the links keep the rest. */
    th.actions-col, td.actions-col {
      width: 1%;
      padding-left: 6px;
      white-space: nowrap;
    }

    .row-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    button.start, button.stop {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      /* Wide enough for "Starting..." and "Stopping...", so the label never
         resizes it. */
      min-width: 128px;
      height: 36px;
      padding: 0 16px;
      border: 1px solid transparent;
      border-radius: 999px;
      color: #fff;
      font: inherit;
      font-weight: 650;
      letter-spacing: 0.01em;
      cursor: pointer;
    }

    button.start .glyph, button.stop .glyph {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      background: currentColor;
    }

    button.start .glyph { clip-path: polygon(10% 0, 100% 50%, 10% 100%); }
    button.stop .glyph { border-radius: 2px; }

    button.start { background: var(--start); }
    button.start:hover:not(:disabled) { background: var(--start-hover); }
    button.stop { background: var(--stop); }
    button.stop:hover:not(:disabled) { background: var(--stop-hover); }

    button.stop.armed,
    button.stop.armed:hover:not(:disabled) {
      background: var(--focus);
      color: #1b1f24;
    }

    button.start:disabled, button.stop:disabled {
      border-color: var(--line);
      background: transparent;
      color: var(--muted);
      cursor: default;
    }

    button.start.idle:disabled, button.stop.idle:disabled { opacity: 0.6; }

    button.start.starting { border-color: var(--start-hover); color: var(--text); }
    button.start.starting .glyph { background: var(--start-hover); }
    button.stop.stopping { border-color: var(--stop); color: var(--text); }
    button.stop.stopping .glyph { background: var(--stop); }
    button.start.starting .glyph, button.stop.stopping .glyph {
      animation: busy-pulse 1s ease-in-out infinite;
    }

    @keyframes busy-pulse {
      50% { opacity: 0.25; }
    }

    @media (prefers-reduced-motion: reduce) {
      button.start.starting .glyph, button.stop.stopping .glyph { animation: none; }
    }

    .service:focus-visible, button:focus-visible, input:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    footer {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
    }

    footer code {
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      overflow-wrap: anywhere;
    }

    /* Phones: a 16px gutter, and nothing wider than the screen but the
       tables (which scroll in their boxes) and the tabs (which scroll too). */
    @media (max-width: 640px) {
      header { padding: 16px 16px 0; }
      main { padding: 16px 16px 32px; }
      .title-row { flex-wrap: wrap; align-items: center; }
      .actions { padding-bottom: 0; }
      nav.tabs { overflow-x: auto; }
      nav.tabs button { flex: 0 0 auto; white-space: nowrap; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title-row">
      <div>
        <h1 id="title">WhatsUp</h1>
        <p class="summary" id="summary">Checking local ports…</p>
      </div>
      <div class="actions">
        <label class="toggle">
          <input id="up-only" type="checkbox">
          Up only
        </label>
        <button class="quit" id="quit" type="button">Quit</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Groups"></nav>
  </header>
  <main>
    <div class="banner" id="banner" role="status"></div>
    <div id="tables"></div>
    <footer id="footer"></footer>
  </main>
  <script>
    const tabsEl = document.getElementById("tabs");
    const tablesEl = document.getElementById("tables");
    const summaryEl = document.getElementById("summary");
    const titleEl = document.getElementById("title");
    const bannerEl = document.getElementById("banner");
    const footerEl = document.getElementById("footer");
    const upOnlyEl = document.getElementById("up-only");
    const quitEl = document.getElementById("quit");

    const requestedGroup = new URLSearchParams(location.search).get("group");
    let activeFilter = asFilter(requestedGroup || sessionStorage.getItem("whatsup-tab") || "");
    let timer = 0;
    let lastView = "";
    let multiMachine = false;
    // The banner shows one message: a WhatsUp problem, else the config
    // error, else the last failed start, stop or open (which stays until the
    // next one, or a click).
    const notices = { system: "", config: "", action: "" };
    // Start and Stop buttons outlive the tables, which are rebuilt whenever
    // the status changes. Keyed "machine/group/index": a Stop waiting for its
    // confirming click, or a request in flight.
    const rowState = new Map(); // -> "armed" | "stopping" | "starting-request"
    const armTimers = new Map();
    const ARMED_MS = 4000;
    // After a start reply, the ports it started, until they are all up or
    // STARTING_MS passes. This alone keeps Start at "Starting...", so it can
    // sit beside an armed Stop.
    const startWatch = new Map(); // -> { ports: number[], timer }
    const STARTING_MS = 3 * 60 * 1000;
    let lastData = null;
    upOnlyEl.checked = localStorage.getItem("whatsup-up-only") === "1";

    // Tabs filter sections: "all", "machine:<name>" or "group:<id>". Older
    // stored values are bare group ids.
    function asFilter(value) {
      if (!value || value === "all" || value.includes(":")) return value || "all";
      return "group:" + value;
    }

    upOnlyEl.addEventListener("change", () => {
      localStorage.setItem("whatsup-up-only", upOnlyEl.checked ? "1" : "0");
      document.querySelectorAll("#tables tbody tr").forEach(applyUpOnly);
      applyGroupVisibility();
    });

    quitEl.addEventListener("click", async () => {
      quitEl.disabled = true;
      clearTimeout(timer);
      await fetch("/api/quit", { method: "POST" });
      notice("system", "WhatsUp stopped. You can close this tab.");
      summaryEl.textContent = "Stopped";
    });

    function notice(kind, text) {
      notices[kind] = text || "";
      const shown = notices.system || notices.config || notices.action;
      bannerEl.textContent = shown;
      bannerEl.classList.toggle("show", Boolean(shown));
      const dismissable = Boolean(shown) && shown === notices.action;
      bannerEl.classList.toggle("dismissable", dismissable);
      bannerEl.title = dismissable ? "Click to dismiss" : "";
    }

    bannerEl.addEventListener("click", () => {
      if (bannerEl.classList.contains("dismissable")) notice("action", "");
    });

    function shows(panel) {
      if (activeFilter === "all") return true;
      const [kind, value] = activeFilter.split(/:(.*)/s);
      return kind === "machine" ? panel.dataset.machine === value : panel.dataset.group === value;
    }

    function applyGroupVisibility() {
      document.querySelectorAll("#tabs button").forEach((button) => {
        button.setAttribute("aria-selected", button.dataset.filter === activeFilter ? "true" : "false");
      });
      let first = true;
      document.querySelectorAll("#tables > .panel").forEach((panel) => {
        // "Up only" can hide every row of a table; a bare header row says
        // nothing, so the whole section goes.
        const rows = [...panel.querySelectorAll("tbody tr")];
        const empty = rows.length > 0 && rows.every((row) => row.classList.contains("hidden"));
        panel.hidden = !shows(panel) || empty;
        panel.classList.toggle("first", !panel.hidden && first);
        if (!panel.hidden) first = false;
        // With one machine a group tab shows just its table, as it always has.
        const heading = panel.querySelector("h2");
        heading.classList.toggle("hidden", !multiMachine && activeFilter.startsWith("group:"));
      });
    }

    function applyUpOnly(row) {
      const links = [...row.querySelectorAll(".service")];
      const anyUp = links.some((link) => link.classList.contains("up"));
      const hide = upOnlyEl.checked && links.length > 0 && !anyUp;
      row.classList.toggle("hidden", hide);
    }

    function viewKey(data) {
      const copy = Object.assign({}, data);
      delete copy.checked_at_ms;
      return JSON.stringify(copy);
    }

    function machinesOf(data) {
      return data.machines || [{ name: data.machine || "", local: true, offline: false, note: null }];
    }

    function paintSummary(data) {
      const when = new Date(data.checked_at_ms);
      const clock = when.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
      const remotes = machinesOf(data).filter((machine) => !machine.local).map((machine) =>
        machine.offline
          ? " · " + machine.name + " offline"
          : " · " + machine.name + " " + machine.ports_up + " of " + machine.ports_total
      );
      summaryEl.textContent =
        data.ports_up + " of " + data.ports_total + " ports listening" + remotes.join("") + " · " + clock;
    }

    function tabButton(filter, label) {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.filter = filter;
      button.textContent = label;
      button.addEventListener("click", () => {
        activeFilter = filter;
        sessionStorage.setItem("whatsup-tab", activeFilter);
        applyGroupVisibility();
      });
      return button;
    }

    function divider() {
      const line = document.createElement("span");
      line.className = "divider";
      line.setAttribute("aria-hidden", "true");
      return line;
    }

    function render(data) {
      // Name the machine whenever the config knows about several, so a
      // dashboard reached through a proxied profile cannot pass for this one.
      const title = (data.title || "WhatsUp") + (data.show_machine && data.machine ? " · " + data.machine : "");
      document.title = title;
      titleEl.textContent = title;
      paintSummary(data);
      notice("system", "");
      notice("config", data.config_error || "");
      // Before the early return: a row can come up without the view changing
      // shape for long, and a watch must end the moment it does.
      lastData = data;
      checkStartWatches(data);
      const nextView = viewKey(data);
      if (nextView === lastView) return;
      lastView = nextView;

      const machines = machinesOf(data);
      const byName = Object.fromEntries(machines.map((machine) => [machine.name, machine]));
      multiMachine = machines.length > 1;
      const groups = [];
      data.groups.forEach((group) => {
        if (!groups.some((known) => known.id === group.id)) groups.push(group);
      });

      const filters = [
        "all",
        ...(multiMachine ? machines.map((machine) => "machine:" + machine.name) : []),
        ...groups.map((group) => "group:" + group.id),
      ];
      if (!filters.includes(activeFilter)) activeFilter = "all";

      tabsEl.replaceChildren(tabButton("all", "All"));
      if (multiMachine) {
        machines.forEach((machine) => tabsEl.appendChild(tabButton("machine:" + machine.name, machine.name)));
        tabsEl.appendChild(divider());
      }
      groups.forEach((group) => tabsEl.appendChild(tabButton("group:" + group.id, group.label)));

      tablesEl.replaceChildren();
      data.groups.forEach((group) => {
        const machine = byName[group.machine] || machines[0];
        const panel = document.createElement("div");
        panel.className = "panel";
        panel.dataset.group = group.id;
        panel.dataset.machine = machine.name;
        const heading = document.createElement("h2");
        const label = document.createElement("span");
        label.textContent = group.label;
        heading.appendChild(label);
        if (multiMachine) {
          const tag = document.createElement("span");
          tag.className = "tag" + (machine.local ? "" : " remote");
          tag.textContent = machine.name;
          heading.appendChild(tag);
          if (machine.note) {
            const note = document.createElement("span");
            note.className = "note";
            note.textContent = machine.note;
            heading.appendChild(note);
          }
        }
        const scroller = document.createElement("div");
        scroller.className = "table-scroll";
        scroller.appendChild(buildTable(group, machine));
        panel.append(heading, scroller);
        tablesEl.appendChild(panel);
      });
      applyGroupVisibility();

      footerEl.replaceChildren();
      footerEl.append("A port is up when something accepts TCP on 127.0.0.1 or ::1.");
      if (multiMachine) footerEl.append(" Remote machines are checked through their SSH tunnel.");
      footerEl.append(" Config: ");
      const code = document.createElement("code");
      code.textContent = data.config_path;
      footerEl.append(code);
    }

    function buildTable(group, machine) {
      const table = document.createElement("table");
      const head = document.createElement("thead");
      const headRow = document.createElement("tr");
      group.columns.forEach((column) => {
        const th = document.createElement("th");
        th.scope = "col";
        th.textContent = column;
        headRow.appendChild(th);
      });
      const actionsHead = document.createElement("th");
      actionsHead.scope = "col";
      actionsHead.className = "actions-col";
      actionsHead.setAttribute("aria-label", "Start and stop");
      headRow.appendChild(actionsHead);
      head.appendChild(headRow);
      table.appendChild(head);

      const body = document.createElement("tbody");
      sections(group.rows).forEach((section) => {
        const services = section.flatMap((row) => row.cells.filter((cell) => cell && cell.type === "link"));
        const allUp = services.length > 0 && services.every((cell) => cell.up);
        section.forEach((row) => {
          const tr = document.createElement("tr");
          tr.className = row.tone === "black" ? "black" : "gray";
          tr.classList.toggle("all-up", allUp);
          row.cells.forEach((cell) => tr.appendChild(renderCell(cell, machine)));
          tr.appendChild(renderActionsCell(group, row, machine));
          applyUpOnly(tr);
          body.appendChild(tr);
        });
      });
      table.appendChild(body);
      return table;
    }

    // A section is a run of consecutive rows sharing the same tone band.
    function sections(rows) {
      const result = [];
      rows.forEach((row, index) => {
        if (index === 0 || row.tone !== rows[index - 1].tone) result.push([]);
        result[result.length - 1].push(row);
      });
      return result;
    }

    function renderCell(cell, machine) {
      const td = document.createElement("td");
      if (!cell || cell.type === "empty") return td;
      if (cell.type === "text") {
        td.textContent = cell.text;
        const herdr = cell.herdr || [];
        if (herdr.length) {
          const extra = document.createElement("span");
          extra.className = "herdr";
          const label = document.createElement("span");
          label.className = "label";
          label.textContent = herdr[0];
          extra.append("/", label);
          if (herdr.length > 1) extra.append(" +" + (herdr.length - 1));
          td.appendChild(extra);
          td.title = "herdr: " + herdr.join(", ");
        }
        return td;
      }
      const button = document.createElement("button");
      button.type = "button";
      button.className = "service" + (cell.up ? " up" : "") + (machine.offline ? " offline" : "");
      button.disabled = !cell.up;
      if (machine.offline) button.title = machine.note || machine.name + " is offline";
      else if (!cell.up) button.title = "Nothing is listening on port " + cell.port;

      const dot = document.createElement("span");
      dot.className = "dot";
      dot.setAttribute("aria-hidden", "true");

      const copy = document.createElement("span");
      copy.className = "copy";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = cell.label;
      const port = document.createElement("span");
      port.className = "port";
      port.textContent = String(cell.port);
      copy.append(name, port);
      button.append(dot, copy);
      if (cell.up) {
        button.addEventListener("click", () => openLink(button, cell.url, machine.name));
      }
      td.appendChild(button);
      return td;
    }

    function rowKey(machineName, groupId, index) {
      return machineName + "/" + groupId + "/" + index;
    }

    function findRow(data, key) {
      const machines = machinesOf(data);
      for (const group of data.groups) {
        const machine = machines.find((known) => known.name === group.machine) || machines[0];
        const row = group.rows.find((candidate) => rowKey(machine.name, group.id, candidate.index) === key);
        if (row) return { group, row };
      }
      return null;
    }

    function linksOf(row) {
      return row.cells.filter((cell) => cell && cell.type === "link");
    }

    // The same rule as the server's "already up": any link on the port.
    function portUp(row, port) {
      return linksOf(row).some((cell) => cell.port === port && cell.up);
    }

    function rowName(group, row) {
      const text = row.cells.find((cell) => cell && cell.type === "text");
      return row.id || (text && text.text) || group.id + "/" + row.index;
    }

    function actionButton(kind, key, blocked) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = kind;
      button.dataset.key = key;
      button.dataset.blocked = blocked;
      const glyph = document.createElement("span");
      glyph.className = "glyph";
      glyph.setAttribute("aria-hidden", "true");
      const label = document.createElement("span");
      label.className = "label";
      button.append(glyph, label);
      return button;
    }

    function renderActionsCell(group, row, machine) {
      const td = document.createElement("td");
      td.className = "actions-col";
      const ports = row.ports || [];
      if (!ports.length) return td;

      const key = rowKey(machine.name, group.id, row.index);
      const request = { machine: machine.name, group: group.id, row: row.index, ports };
      // Why each button cannot act right now, if so.
      const links = linksOf(row);
      const offline = machine.offline ? machine.note || machine.name + " is offline" : "";
      const cannot = machine.can_act === false ? "Start WhatsUp on " + machine.name + " to " : "";
      const start = actionButton("start", key,
        offline ||
        (cannot && cannot + "start its stacks") ||
        (links.some((cell) => !cell.up) ? "" : "Everything is running"));
      const stop = actionButton("stop", key,
        offline ||
        (cannot && cannot + "stop its stacks") ||
        (links.some((cell) => cell.up) ? "" : "Nothing is running"));
      start.addEventListener("click", () => startClicked(key, request));
      stop.addEventListener("click", () => stopClicked(key, request));

      const wrap = document.createElement("div");
      wrap.className = "row-actions";
      wrap.append(start, stop);
      td.appendChild(wrap);
      paintActions(key, td);
      return td;
    }

    // Paints the row's buttons: those under `root` (a cell not yet in the
    // page), else every copy in the page.
    function paintActions(key, root = document) {
      const state = rowState.get(key) || "";
      const busy = state === "stopping" || state === "starting-request";
      root.querySelectorAll(".row-actions").forEach((wrap) => {
        const start = wrap.querySelector("button.start");
        const stop = wrap.querySelector("button.stop");
        if (start.dataset.key !== key) return;

        const stopBlocked = stop.dataset.blocked || "";
        // Nothing left to confirm once the row cannot be stopped.
        const stopShows = state === "stopping" ? "stopping" : state === "armed" && !stopBlocked ? "armed" : "idle";
        stop.className = "stop " + stopShows;
        stop.disabled = busy || (stopShows === "idle" && Boolean(stopBlocked));
        stop.querySelector(".label").textContent =
          stopShows === "armed" ? "Confirm" : stopShows === "stopping" ? "Stopping..." : "Stop";
        stop.title =
          busy ? "" :
          stopShows === "armed" ? "Click again to stop everything on this row's ports" :
          stopBlocked || "Stop everything on this row's ports";

        // An armed Stop waits for its confirming click; Start waits for it.
        const armed = stopShows === "armed";
        const startBlocked = start.dataset.blocked || "";
        const starting = state === "starting-request" || startWatch.has(key);
        start.className = "start " + (starting ? "starting" : "idle");
        start.disabled = starting || busy || armed || Boolean(startBlocked);
        start.querySelector(".label").textContent = starting ? "Starting..." : "Start";
        start.title =
          starting || busy ? "" :
          armed ? "Confirm or wait for Stop first" :
          startBlocked || "Start whatever of this row is not running";
      });
    }

    function setRowState(key, state) {
      clearTimeout(armTimers.get(key));
      armTimers.delete(key);
      if (state) rowState.set(key, state);
      else rowState.delete(key);
      paintActions(key);
    }

    function endWatch(key) {
      const watch = startWatch.get(key);
      if (!watch) return;
      clearTimeout(watch.timer);
      startWatch.delete(key);
      paintActions(key);
    }

    // Ends each watch whose ports are all up, or whose row is gone.
    function checkStartWatches(data) {
      if (!data) return;
      startWatch.forEach((watch, key) => {
        const found = findRow(data, key);
        if (!found || watch.ports.every((port) => portUp(found.row, port))) endWatch(key);
      });
    }

    function startTimedOut(key) {
      const watch = startWatch.get(key);
      endWatch(key);
      const found = lastData && findRow(lastData, key);
      if (!watch || !found) return;
      const waiting = watch.ports.filter((port) => !portUp(found.row, port)).map((port) => {
        const link = linksOf(found.row).find((cell) => cell.port === port);
        return (link ? link.label : "port") + " (" + port + ")";
      });
      if (waiting.length) {
        notice("action", rowName(found.group, found.row) + ": still waiting for " + waiting.join(", ") + "...; see its herdr tab");
      }
    }

    async function startClicked(key, request) {
      setRowState(key, "starting-request");
      notice("action", "");
      let started = [];
      try {
        const response = await fetch("/api/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(request),
        });
        const payload = (await response.json().catch(() => null)) || {};
        if (!response.ok) notice("action", "Start failed: " + (payload.error || "status " + response.status));
        // A failed reply may still have started some ports: watch those too.
        started = (payload.results || [])
          .filter((result) => result.action !== "none" && !result.error)
          .map((result) => result.port);
      } catch (err) {
        notice("action", "Start failed: could not reach WhatsUp");
      }
      if (started.length) {
        clearTimeout((startWatch.get(key) || {}).timer);
        startWatch.set(key, { ports: started, timer: setTimeout(() => startTimedOut(key), STARTING_MS) });
      }
      setRowState(key, null);
      checkStartWatches(lastData);
    }

    async function stopClicked(key, request) {
      if (rowState.get(key) !== "armed") {
        setRowState(key, "armed");
        armTimers.set(key, setTimeout(() => setRowState(key, null), ARMED_MS));
        return;
      }
      // Stopping ends a start still on its way up.
      endWatch(key);
      setRowState(key, "stopping");
      notice("action", "");
      try {
        const response = await fetch("/api/stop", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(request),
        });
        const payload = (await response.json().catch(() => null)) || {};
        if (!response.ok) notice("action", "Stop failed: " + (payload.error || "status " + response.status));
      } catch (err) {
        notice("action", "Stop failed: could not reach WhatsUp");
      } finally {
        setRowState(key, null);
      }
    }

    async function openLink(button, url, machine) {
      button.disabled = true;
      try {
        const response = await fetch("/api/open", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url, machine }),
        });
        const payload = (await response.json().catch(() => null)) || {};
        notice("action", response.ok ? "" : payload.error || "Could not open the browser");
      } catch (err) {
        notice("action", "Could not reach WhatsUp");
      } finally {
        button.disabled = false;
      }
    }

    async function refresh() {
      try {
        const response = await fetch("/api/dashboard", { cache: "no-store" });
        if (!response.ok) throw new Error("status " + response.status);
        const data = await response.json();
        render(data);
        paintSummary(data);
        timer = setTimeout(refresh, data.refresh_ms || 2000);
      } catch (err) {
        notice("system", "WhatsUp is not responding");
        timer = setTimeout(refresh, 2000);
      }
    }

    refresh();
  </script>
</body>
</html>
