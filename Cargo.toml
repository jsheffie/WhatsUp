[package]
name = "whatsup"
version = "0.1.0"
edition = "2021"
description = "Local dashboard that shows which dev services are listening and opens them in Chrome"
publish = false

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
